[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-notice"
version = "0.1.0"
description = "Automated strategy email alerts for trading notice workflows"
requires-python = ">=3.10"
dependencies = [
  "ccxt>=4.0",
  "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
