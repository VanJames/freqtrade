---
services:
  freqtrade:
    image: freqtrade-local-freqai
    build:
      context: .
      dockerfile: "./docker/Dockerfile.freqai"
      args:
        sourceimage: freqtradeorg/freqtrade
        sourcetag: stable
    # Use plotting image
    # image: freqtradeorg/freqtrade:develop_plot
    # # Enable GPU Image and GPU Resources (only relevant for freqAI)
    # # Make sure to uncomment the whole deploy section
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Build step - only needed when additional dependencies are needed
    # build:
    #   context: .
    #   dockerfile: "./docker/Dockerfile.custom"
    restart: unless-stopped
    container_name: freqtrade
    env_file:
      - .env
    environment:
      FT_EMAIL_HOST: ${FT_EMAIL_HOST}
      FT_EMAIL_PORT: ${FT_EMAIL_PORT}
      FT_EMAIL_USER: ${FT_EMAIL_USER}
      FT_EMAIL_PASSWORD: ${FT_EMAIL_PASSWORD}
      FT_EMAIL_FROM: ${FT_EMAIL_FROM}
      FT_EMAIL_TO: ${FT_EMAIL_TO}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_MODEL: ${OPENAI_MODEL}
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "0.0.0.0:3000:8080"
    # Default command used when running `docker compose up`
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --freqaimodel LightGBMRegressor
      --strategy SampleStrategy

  optimizer:
    image: freqtrade-local-freqai
    build:
      context: .
      dockerfile: "./docker/Dockerfile.freqai"
      args:
        sourceimage: freqtradeorg/freqtrade
        sourcetag: stable
    profiles:
      - optimizer
    restart: unless-stopped
    container_name: freqtrade-optimizer
    user: ftuser
    entrypoint: ["python"]
    env_file:
      - .env
    environment:
      FT_EMAIL_HOST: ${FT_EMAIL_HOST}
      FT_EMAIL_PORT: ${FT_EMAIL_PORT}
      FT_EMAIL_USER: ${FT_EMAIL_USER}
      FT_EMAIL_PASSWORD: ${FT_EMAIL_PASSWORD}
      FT_EMAIL_FROM: ${FT_EMAIL_FROM}
      FT_EMAIL_TO: ${FT_EMAIL_TO}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_MODEL: ${OPENAI_MODEL}
    volumes:
      - ".:/workspace"
      - "/var/run/docker.sock:/var/run/docker.sock"
    working_dir: /workspace
    command:
      - /workspace/scripts/auto_optimize_loop.py
      - --backend
      - local
      - --strategy
      - SampleStrategy
      - --config
      - /workspace/user_data/config.json
      - --strategy-path
      - /workspace/user_data/strategies
      - --interval-hours
      - "6"
      - --jitter-seconds
      - "300"
      - --backtest-days
      - "60"
      - --epochs
      - "60"
      - --min-trades
      - "20"
      - --min-profit-delta-pct
      - "0.25"
      - --max-drawdown-worsen
      - "0.02"
      - --freqaimodel
      - LightGBMRegressor
      - --apply
      - --restart-bot
