---
services:
  freqtrade:
    image: freqtrade-local-freqai
    build:
      context: .
      dockerfile: "./docker/Dockerfile.freqai"
      args:
        sourceimage: freqtradeorg/freqtrade
        sourcetag: stable
    # Use plotting image
    # image: freqtradeorg/freqtrade:develop_plot
    # # Enable GPU Image and GPU Resources (only relevant for freqAI)
    # # Make sure to uncomment the whole deploy section
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Build step - only needed when additional dependencies are needed
    # build:
    #   context: .
    #   dockerfile: "./docker/Dockerfile.custom"
    restart: unless-stopped
    container_name: freqtrade
    env_file:
      - .env
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./scripts:/freqtrade/scripts:ro"
    ports:
      - "0.0.0.0:3000:8080"
    # Default command used when running `docker compose up`
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --freqaimodel LightGBMRegressor

  optimizer:
    image: freqtrade-local-freqai
    build:
      context: .
      dockerfile: "./docker/Dockerfile.freqai"
      args:
        sourceimage: freqtradeorg/freqtrade
        sourcetag: stable
    profiles:
      - optimizer
    restart: unless-stopped
    container_name: freqtrade-optimizer
    user: ftuser
    entrypoint: ["python"]
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ".:/workspace"
      - "/var/run/docker.sock:/var/run/docker.sock"
    working_dir: /workspace
    command:
      - /workspace/scripts/auto_optimize_loop.py
      - --backend
      - local
      - --strategy
      - auto
      - --config
      - /workspace/user_data/config.json
      - --strategy-path
      - /workspace/user_data/strategies
      - --interval-hours
      - "6"
      - --jitter-seconds
      - "300"
      - --backtest-days
      - "60"
      - --epochs
      - "60"
      - --min-trades
      - "20"
      - --min-profit-delta-pct
      - "0.25"
      - --max-drawdown-worsen
      - "0.02"
      - --freqaimodel
      - LightGBMRegressor
      - --apply
      - --restart-bot

  direction-advisor:
    image: freqtrade-local-freqai
    build:
      context: .
      dockerfile: "./docker/Dockerfile.freqai"
      args:
        sourceimage: freqtradeorg/freqtrade
        sourcetag: stable
    profiles:
      - optimizer
    restart: unless-stopped
    container_name: freqtrade-direction-advisor
    user: ftuser
    entrypoint: ["python"]
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ".:/workspace"
      - "/var/run/docker.sock:/var/run/docker.sock"
    working_dir: /workspace
    command:
      - /workspace/scripts/direction_advisor.py
      - --backend
      - local
      - --config
      - /workspace/user_data/config.json
      - --strategy-path
      - /workspace/user_data/strategies
      - --backtest-days
      - "2"
      - --min-side-trades
      - "1"
      - --registry-pool-positive-window-days
      - "7"
      - --registry-target-positive-window-days
      - "7"
      - --min-registry-window-profit-pct
      - "0.0"
      - --trade-db
      - /workspace/user_data/tradesv3.sqlite
      - --real-trade-lookback
      - "300"
      - --real-trade-direction-min-samples
      - "3"
      - --real-trade-direction-step
      - "0.04"
      - --real-trade-direction-max-bonus
      - "0.15"
      - --use-llm-advisor
      - --advisor-model
      - deepseek-chat
      - --interval-minutes
      - "30"
      - --loop

  strategy-researcher:
    image: freqtrade-local-freqai
    build:
      context: .
      dockerfile: "./docker/Dockerfile.freqai"
      args:
        sourceimage: freqtradeorg/freqtrade
        sourcetag: stable
    profiles:
      - optimizer
    restart: unless-stopped
    container_name: freqtrade-strategy-researcher
    depends_on:
      - ai-strategy-lab
    user: ftuser
    entrypoint: ["python"]
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ".:/workspace"
      - "/var/run/docker.sock:/var/run/docker.sock"
    working_dir: /workspace
    command:
      - /workspace/scripts/strategy_researcher.py
      - --backend
      - local
      - --config
      - /workspace/user_data/config.json
      - --strategy-path
      - /workspace/user_data/strategies
      - --strategies
      - AIGeneratedLongTrendContinuationRunner2xSelective
      - AIGeneratedLongTrendContinuationRunner2x
      - --include-ai-generated
      - --ai-candidates
      - /workspace/user_data/autoopt/ai_strategy_candidates.json
      - --kronos-forecast
      - /workspace/user_data/autoopt/kronos_forecast.json
      - --windows
      - "1"
      - "2"
      - "7"
      - "30"
      - "60"
      - --output
      - /workspace/user_data/autoopt/strategy_registry.json
      - --formal-pool-output
      - /workspace/user_data/autoopt/formal_strategy_pool.json
      - --formal-pool-required-window-days
      - "7"
      - "30"
      - --formal-pool-min-profit-pct
      - "0.0"
      - --formal-pool-min-trades
      - "5"
      - --formal-pool-max-strategies
      - "6"
      - --ledger
      - /workspace/user_data/autoopt/strategy_researcher.jsonl
      - --trade-db
      - /workspace/user_data/tradesv3.sqlite
      - --real-trade-lookback
      - "300"
      - --real-trade-priority-min-samples
      - "3"
      - --real-trade-priority-step
      - "0.03"
      - --real-trade-priority-max-bonus
      - "0.12"
      - --min-trades
      - "1"
      - --slippage-buffer-pct-per-trade
      - "0.04"
      - --min-net-profit-pct
      - "0.10"
      - --min-pass-rate
      - "0.50"
      - --pair-selection-output
      - /workspace/user_data/autoopt/pair_selection.json
      - --pair-selection-window-days
      - "30"
      - --pair-selection-min-trades
      - "1"
      - --pair-selection-min-profit-pct
      - "0.0"
      - --pair-selection-max-pairs
      - "6"
      - --pair-selection-min-hold-runs
      - "2"
      - --pair-selection-remove-below-profit-pct
      - "-0.15"
      - --use-llm-advisor
      - --advisor-model
      - deepseek-chat
      - --interval-minutes
      - "360"
      - --loop

  ai-strategy-lab:
    image: freqtrade-local-freqai
    build:
      context: .
      dockerfile: "./docker/Dockerfile.freqai"
      args:
        sourceimage: freqtradeorg/freqtrade
        sourcetag: stable
    profiles:
      - optimizer
    restart: unless-stopped
    container_name: freqtrade-ai-strategy-lab
    user: ftuser
    entrypoint: ["python"]
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ".:/workspace"
    working_dir: /workspace
    command:
      - /workspace/scripts/ai_strategy_lab.py
      - --config
      - /workspace/user_data/config.json
      - --strategy-path
      - /workspace/user_data/strategies
      - --output
      - /workspace/user_data/autoopt/ai_strategy_candidates.json
      - --ledger
      - /workspace/user_data/autoopt/ai_strategy_lab.jsonl
      - --kronos-forecast
      - /workspace/user_data/autoopt/kronos_forecast.json
      - --formal-pool
      - /workspace/user_data/autoopt/formal_strategy_pool.json
      - --use-llm
      - --advisor-model
      - deepseek-chat
      - --max-candidates
      - "6"
      - --exploration-max-candidates
      - "10"
      - --exploration-stale-runs-threshold
      - "3"
      - --preserved-prune-stale-runs-threshold
      - "6"
      - --max-preserved-strategies
      - "12"
      - --interval-minutes
      - "360"
      - --loop

  strategy-switcher:
    image: freqtrade-local-freqai
    build:
      context: .
      dockerfile: "./docker/Dockerfile.freqai"
      args:
        sourceimage: freqtradeorg/freqtrade
        sourcetag: stable
    profiles:
      - optimizer
    restart: unless-stopped
    container_name: freqtrade-strategy-switcher
    user: ftuser
    entrypoint: ["python"]
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ".:/workspace"
      - "/var/run/docker.sock:/var/run/docker.sock"
    working_dir: /workspace
    command:
      - /workspace/scripts/strategy_switcher.py
      - --backend
      - docker
      - --container
      - freqtrade
      - --loss-fallback-from-strategy
      - AIGeneratedLongTrendContinuationRunner2x
      - --loss-fallback-to-strategy
      - AIGeneratedLongTrendContinuationRunner2xSelective
      - --loss-fallback-lookback-trades
      - "5"
      - --loss-fallback-loss-threshold
      - "3"
      - --loss-recovery-from-strategy
      - AIGeneratedLongTrendContinuationRunner2xSelective
      - --loss-recovery-to-strategy
      - AIGeneratedLongTrendContinuationRunner2x
      - --loss-recovery-lookback-trades
      - "5"
      - --loss-recovery-win-threshold
      - "3"
      - --loss-recovery-min-hold-days
      - "3"
      - --loss-recovery-min-score-margin
      - "0.4"
      - --config
      - /workspace/user_data/config.json
      - --registry
      - /workspace/user_data/autoopt/strategy_registry.json
      - --formal-pool
      - /workspace/user_data/autoopt/formal_strategy_pool.json
      - --db
      - /workspace/user_data/tradesv3.sqlite
      - --min-passed-windows
      - "2"
      - --min-trades
      - "5"
      - --min-score-margin
      - "0.15"
      - --allow-strategies
      - AIGeneratedLongTrendContinuationRunner2xSelective
      - AIGeneratedLongTrendContinuation
      - AIGeneratedLongTrendContinuationRunner
      - AIGeneratedLongTrendContinuationRunner2x
      - --disable-inactivity-fallback
      - --inactive-window-days
      - "1"
      - --inactive-min-trades
      - "10"
      - --inactive-min-profit-pct
      - "0.05"
      - --inactive-min-score
      - "-1.25"
      - --require-positive-window-days
      - "7"
      - --pool-positive-window-days
      - "7"
      - --min-required-window-profit-pct
      - "0.0"
      - --cooldown-minutes
      - "360"
      - --max-registry-age-minutes
      - "180"
      - --interval-minutes
      - "30"
      - --loop

  kronos-advisor:
    image: freqtrade-local-freqai
    build:
      context: .
      dockerfile: "./docker/Dockerfile.freqai"
      args:
        sourceimage: freqtradeorg/freqtrade
        sourcetag: stable
    profiles:
      - optimizer
    restart: unless-stopped
    container_name: freqtrade-kronos-advisor
    user: ftuser
    entrypoint: ["python"]
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ".:/workspace"
    working_dir: /workspace
    command:
      - /workspace/scripts/kronos_advisor.py
      - --config
      - /workspace/user_data/config.json
      - --output
      - /workspace/user_data/autoopt/kronos_forecast.json
      - --ledger
      - /workspace/user_data/autoopt/kronos_forecast.jsonl
      - --lookback
      - "400"
      - --pred-len
      - "24"
      - --interval-minutes
      - "30"
      - --loop

  trade-settings:
    image: freqtrade-local-freqai
    build:
      context: .
      dockerfile: "./docker/Dockerfile.freqai"
      args:
        sourceimage: freqtradeorg/freqtrade
        sourcetag: stable
    restart: unless-stopped
    container_name: freqtrade-trade-settings
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      TRADE_SETTINGS_ROOT: /workspace
      PUBLIC_BASE_PATH: /trade-settings
    volumes:
      - ".:/workspace"
    working_dir: /workspace
    ports:
      - "0.0.0.0:3001:8090"
    entrypoint: ["python"]
    command:
      - -m
      - uvicorn
      - scripts.trade_settings_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
