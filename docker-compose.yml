services:
  app:
    build: .
    environment:
      POSTGRES_DSN: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
      DRY_RUN: ${DRY_RUN:-true}
    secrets:
      - app_env
    depends_on:
      init-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["run", "--no-dry-run", "--with-store", "--with-redis"]
    restart: unless-stopped

  init-db:
    build: .
    environment:
      POSTGRES_DSN: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/trading
    secrets:
      - app_env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["init-db"]
    restart: "no"

  backtest:
    build: .
    command: ["backtest", "--days", "${BACKTEST_DAYS:-90}", "--classifier-mode", "user_4h"]
    secrets:
      - app_env
    volumes:
      - ./reports:/app/reports
      - ohlcv_cache:/app/.cache/okx_ohlcv
    profiles: ["tools"]

  runtime-tuner:
    build: .
    environment:
      POSTGRES_DSN: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/trading
    command:
      [
        "tune-runtime-loop",
        "--days",
        "${TUNER_DAYS:-30}",
        "--interval-hours",
        "${TUNER_INTERVAL_HOURS:-24}",
        "--max-iterations",
        "${TUNER_MAX_ITERATIONS:-1}",
        "--min-improvement-score",
        "${TUNER_MIN_IMPROVEMENT_SCORE:-0}",
      ]
    secrets:
      - app_env
    depends_on:
      init-db:
        condition: service_completed_successfully
    volumes:
      - ./reports:/app/reports
      - ohlcv_cache:/app/.cache/okx_ohlcv
    profiles: ["tools"]
    restart: unless-stopped

  dashboard:
    build: .
    environment:
      POSTGRES_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/trading
      DRY_RUN: ${DRY_RUN:-true}
      OKX_DEMO: ${OKX_DEMO:-true}
      SYMBOLS: ${SYMBOLS:-BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT}
      LLM_REGIME_REVIEW_ENABLED: ${LLM_REGIME_REVIEW_ENABLED:-false}
      LLM_REGIME_PROVIDER: ${LLM_REGIME_PROVIDER:-}
      LLM_REGIME_MODEL: ${LLM_REGIME_MODEL:-}
      LLM_REGIME_REVIEW_CACHE_TTL_SECONDS: ${LLM_REGIME_REVIEW_CACHE_TTL_SECONDS:-900}
      LLM_REGIME_REVIEW_MIN_INTERVAL_SECONDS: ${LLM_REGIME_REVIEW_MIN_INTERVAL_SECONDS:-900}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-9527}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-9527}
    depends_on:
      init-db:
        condition: service_completed_successfully
    command: ["python", "-m", "uvicorn", "trading_system.dashboard:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "18080:8080"
    volumes:
      - ./reports:/app/reports:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trading
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  ohlcv_cache:

secrets:
  app_env:
    file: .env
