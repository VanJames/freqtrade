---
services:
  freqtrade:
    image: freqtrade-local-freqai
    build:
      context: .
      dockerfile: "./docker/Dockerfile.freqai"
      args:
        sourceimage: freqtradeorg/freqtrade
        sourcetag: stable
    # Use plotting image
    # image: freqtradeorg/freqtrade:develop_plot
    # # Enable GPU Image and GPU Resources (only relevant for freqAI)
    # # Make sure to uncomment the whole deploy section
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Build step - only needed when additional dependencies are needed
    # build:
    #   context: .
    #   dockerfile: "./docker/Dockerfile.custom"
    restart: unless-stopped
    container_name: freqtrade
    env_file:
      - .env
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./scripts:/freqtrade/scripts:ro"
    ports:
      - "0.0.0.0:3000:8080"
    # Default command used when running `docker compose up`
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --freqaimodel LightGBMRegressor

  optimizer:
    image: freqtrade-local-freqai
    build:
      context: .
      dockerfile: "./docker/Dockerfile.freqai"
      args:
        sourceimage: freqtradeorg/freqtrade
        sourcetag: stable
    profiles:
      - optimizer
    restart: unless-stopped
    container_name: freqtrade-optimizer
    user: ftuser
    entrypoint: ["python"]
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ".:/workspace"
      - "/var/run/docker.sock:/var/run/docker.sock"
    working_dir: /workspace
    command:
      - /workspace/scripts/auto_optimize_loop.py
      - --backend
      - local
      - --strategy
      - auto
      - --config
      - /workspace/user_data/config.json
      - --strategy-path
      - /workspace/user_data/strategies
      - --interval-hours
      - "6"
      - --jitter-seconds
      - "300"
      - --backtest-days
      - "60"
      - --epochs
      - "60"
      - --min-trades
      - "20"
      - --min-profit-delta-pct
      - "0.25"
      - --max-drawdown-worsen
      - "0.02"
      - --freqaimodel
      - LightGBMRegressor
      - --apply
      - --restart-bot

  direction-advisor:
    image: freqtrade-local-freqai
    build:
      context: .
      dockerfile: "./docker/Dockerfile.freqai"
      args:
        sourceimage: freqtradeorg/freqtrade
        sourcetag: stable
    profiles:
      - optimizer
    restart: unless-stopped
    container_name: freqtrade-direction-advisor
    user: ftuser
    entrypoint: ["python"]
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ".:/workspace"
      - "/var/run/docker.sock:/var/run/docker.sock"
    working_dir: /workspace
    command:
      - /workspace/scripts/direction_advisor.py
      - --backend
      - local
      - --config
      - /workspace/user_data/config.json
      - --strategy-path
      - /workspace/user_data/strategies
      - --backtest-days
      - "2"
      - --min-side-trades
      - "1"
      - --use-llm-advisor
      - --advisor-model
      - deepseek-chat
      - --interval-minutes
      - "30"
      - --loop

  strategy-researcher:
    image: freqtrade-local-freqai
    build:
      context: .
      dockerfile: "./docker/Dockerfile.freqai"
      args:
        sourceimage: freqtradeorg/freqtrade
        sourcetag: stable
    profiles:
      - optimizer
    restart: unless-stopped
    container_name: freqtrade-strategy-researcher
    user: ftuser
    entrypoint: ["python"]
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ".:/workspace"
      - "/var/run/docker.sock:/var/run/docker.sock"
    working_dir: /workspace
    command:
      - /workspace/scripts/strategy_researcher.py
      - --backend
      - local
      - --config
      - /workspace/user_data/config.json
      - --strategy-path
      - /workspace/user_data/strategies
      - --windows
      - "1"
      - "2"
      - "7"
      - --min-trades
      - "1"
      - --use-llm-advisor
      - --advisor-model
      - deepseek-chat
      - --interval-minutes
      - "360"
      - --loop

  strategy-switcher:
    image: freqtrade-local-freqai
    build:
      context: .
      dockerfile: "./docker/Dockerfile.freqai"
      args:
        sourceimage: freqtradeorg/freqtrade
        sourcetag: stable
    profiles:
      - optimizer
    restart: unless-stopped
    container_name: freqtrade-strategy-switcher
    user: ftuser
    entrypoint: ["python"]
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ".:/workspace"
      - "/var/run/docker.sock:/var/run/docker.sock"
    working_dir: /workspace
    command:
      - /workspace/scripts/strategy_switcher.py
      - --backend
      - docker
      - --container
      - freqtrade
      - --config
      - /workspace/user_data/config.json
      - --registry
      - /workspace/user_data/autoopt/strategy_registry.json
      - --db
      - /workspace/user_data/tradesv3.sqlite
      - --min-passed-windows
      - "2"
      - --min-trades
      - "5"
      - --min-score-margin
      - "0.15"
      - --inactive-window-days
      - "1"
      - --inactive-min-trades
      - "10"
      - --inactive-min-profit-pct
      - "0.05"
      - --inactive-min-score
      - "-1.25"
      - --cooldown-minutes
      - "360"
      - --max-registry-age-minutes
      - "180"
      - --interval-minutes
      - "30"
      - --loop

  kronos-advisor:
    image: freqtrade-local-freqai
    build:
      context: .
      dockerfile: "./docker/Dockerfile.freqai"
      args:
        sourceimage: freqtradeorg/freqtrade
        sourcetag: stable
    profiles:
      - optimizer
    restart: unless-stopped
    container_name: freqtrade-kronos-advisor
    user: ftuser
    entrypoint: ["python"]
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ".:/workspace"
    working_dir: /workspace
    command:
      - /workspace/scripts/kronos_advisor.py
      - --config
      - /workspace/user_data/config.json
      - --output
      - /workspace/user_data/autoopt/kronos_forecast.json
      - --ledger
      - /workspace/user_data/autoopt/kronos_forecast.jsonl
      - --lookback
      - "400"
      - --pred-len
      - "24"
      - --interval-minutes
      - "30"
      - --loop

  trade-settings:
    image: freqtrade-local-freqai
    build:
      context: .
      dockerfile: "./docker/Dockerfile.freqai"
      args:
        sourceimage: freqtradeorg/freqtrade
        sourcetag: stable
    restart: unless-stopped
    container_name: freqtrade-trade-settings
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      TRADE_SETTINGS_ROOT: /workspace
      PUBLIC_BASE_PATH: /trade-settings
    volumes:
      - ".:/workspace"
    working_dir: /workspace
    ports:
      - "0.0.0.0:3001:8090"
    entrypoint: ["python"]
    command:
      - -m
      - uvicorn
      - scripts.trade_settings_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
